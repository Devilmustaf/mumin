name: Build Android APK (with Icon)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor & Assets Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Prepare Web Directory (www)
        run: |
          mkdir -p www
          cp -r index.html logo.png manifest.json www/ 2>/dev/null || true

      - name: Initialize Capacitor Config
        run: |
          npx cap init Mumin com.devilmustaf.mumin --web-dir www || true

      - name: Add Android Platform
        run: |
          npx cap add android || true

      - name: Prepare Assets Folder & Generate Icons
        run: |
          mkdir -p assets
          cp logo.png assets/icon.png
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mumin-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
